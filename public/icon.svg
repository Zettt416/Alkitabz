<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="100%" stop-color="#0E1013" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />

  <!-- Bible Base / Cover spine shadow -->
  <path d="M 88 150 C 130 140 210 140 256 168 C 302 140 382 140 424 150 C 435 152 444 162 444 174 L 444 380 C 444 394 430 404 416 401 C 376 392 306 392 256 414 C 206 392 136 392 96 401 C 82 404 68 394 68 380 L 68 174 C 68 162 77 152 88 150 Z" 
        fill="#262C36" stroke="#3D4554" stroke-width="4" />

  <!-- Left Page Pages Stack -->
  <path d="M 84 165 C 130 155 208 155 252 180 L 252 396 C 208 372 130 372 84 382 Z" 
        fill="#FBF7EE" />
  <!-- Left Page Lines -->
  <line x1="110" y1="210" x2="226" y2="210" stroke="#DDD4C0" stroke-width="6" stroke-linecap="round" />
  <line x1="110" y1="236" x2="226" y2="236" stroke="#DDD4C0" stroke-width="6" stroke-linecap="round" />
  <line x1="110" y1="262" x2="226" y2="262" stroke="#DDD4C0" stroke-width="6" stroke-linecap="round" />
  <line x1="110" y1="288" x2="226" y2="288" stroke="#DDD4C0" stroke-width="6" stroke-linecap="round" />
  <line x1="110" y1="314" x2="200" y2="314" stroke="#DDD4C0" stroke-width="6" stroke-linecap="round" />

  <!-- Right Page Pages Stack -->
  <path d="M 428 165 C 382 155 304 155 260 180 L 260 396 C 304 372 382 372 428 382 Z" 
        fill="#F6F0E0" />
  <!-- Right Page Lines -->
  <line x1="286" y1="210" x2="402" y2="210" stroke="#DDD4C0" stroke-width="6" stroke-linecap="round" />
  <line x1="286" y1="236" x2="402" y2="236" stroke="#DDD4C0" stroke-width="6" stroke-linecap="round" />
  <line x1="286" y1="262" x2="402" y2="262" stroke="#DDD4C0" stroke-width="6" stroke-linecap="round" />
  <line x1="286" y1="288" x2="402" y2="288" stroke="#DDD4C0" stroke-width="6" stroke-linecap="round" />
  <line x1="286" y1="314" x2="376" y2="314" stroke="#DDD4C0" stroke-width="6" stroke-linecap="round" />

  <!-- Golden Center Cross & Light -->
  <g filter="url(#glow)">
    <!-- Vertical Cross bar -->
    <path d="M 250 80 C 250 76 262 76 262 80 L 262 260 C 262 264 250 264 250 260 Z" fill="url(#goldGrad)" />
    <!-- Horizontal Cross bar -->
    <path d="M 216 122 C 212 122 212 134 216 134 L 296 134 C 300 134 300 122 296 122 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Golden Bookmark Ribbon Hanging -->
  <path d="M 252 396 L 252 440 L 262 426 L 272 440 L 272 396 Z" fill="url(#goldGrad)" />
</svg>
